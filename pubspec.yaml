name: pupcheck
description: PupCheck — canine skin condition scanner (thesis project UI)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.6
  http: ^1.2.2
  http_parser: ^4.0.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  camera: ^0.11.1+2
  app_links: ^6.4.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/model/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"